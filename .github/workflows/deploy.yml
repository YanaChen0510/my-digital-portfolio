name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Debug build output
        run: |
          echo "=== dist/ contents ==="
          ls -la ./dist/ || echo "NO dist/ folder found"
          echo "=== searching for index.html ==="
          find . -name "index.html" -not -path "*/node_modules/*"
          echo "=== dist/client contents ==="
          ls -la ./dist/client/ || echo "NO dist/client/ folder found"

      - name: Copy 404 fallback
        run: cp ./dist/client/index.html ./dist/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
